<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Te LOVEO Michi</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: black; }
  </style>
</head>
<body>
<script>
let particles = [];
let basePositions = [];
let heartCenter;

function setup() {
  createCanvas(windowWidth, windowHeight);
  heartCenter = createVector(width / 2, height / 2 - 50);

  for (let i = 0; i < 10000; i++) { 
    let pos = heartPoint(random(TWO_PI), random(0.6, 1));
    basePositions.push(pos.copy());
    particles.push({
      pos: pos.copy(),
      vel: createVector(0, 0)
    });
  }
}

function heartPoint(t, scaleFactor) {
  let x = 16 * pow(sin(t), 3);
  let y = -(13 * cos(t) - 5 * cos(2*t) - 2 * cos(3*t) - cos(4*t));
  let scale = 10 * scaleFactor;
  return createVector(x * scale + width / 2, y * scale + height / 2);
}

function draw() {
  background(0);
  for (let i = 0; i < particles.length; i++) {
    let p = particles[i];
    let base = basePositions[i];
    let d = dist(mouseX, mouseY, p.pos.x, p.pos.y);
    if (d < 50) { 
      let angle = atan2(p.pos.y - mouseY, p.pos.x - mouseX);
      let force = (50 - d) * 0.05; 
      let push = p5.Vector.fromAngle(angle).mult(force);
      p.vel.add(push);
    }
    let pull = p5.Vector.sub(base, p.pos).mult(0.05);
    p.vel.add(pull);
    p.vel.mult(0.9);
    p.pos.add(p.vel);

    let distToCenter = dist(p.pos.x, p.pos.y, heartCenter.x, heartCenter.y);
    let t = constrain(distToCenter / 140, 0, 1);
    let r = lerp(255, 255, t);
    let g = lerp(128, 0, t);
    let b = lerp(160, 0, t);
    fill(r, g, b); noStroke(); circle(p.pos.x, p.pos.y, 2);
  }

  drawText();
}

function drawText() {
  textAlign(CENTER, CENTER);
  textSize(48);
  for (let dx = -2; dx <= 2; dx++) {
    for (let dy = -2; dy <= 2; dy++) {
      if (dx !== 0 || dy !== 0) {
        fill(255, 0, 0, 50);
        text("TE LOVEO MICHI", width / 2 + dx, height - 80 + dy);
      }
    }
  }
  fill(255, 0, 0);
  text("TE LOVEO MICHI", width / 2, height - 80);
}
</script>
</body>
</html>
